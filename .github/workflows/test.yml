# push と PR のたびに、生成が再現できることと検査が通ることを確かめる。
#
# **ここで見るのは「同じ入力から同じ生成物が出るか」。** 生成物に差分が出たら
# 落とす（開発者が意図を確かめてコミットする）。CI からリポジトリへは push しない。
# 生成の順序は build/all.mjs が持つので、ここでは並べ直さない。
name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読み取りだけ。生成物を CI から書き戻さない
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      # データが壊れた状態から 1,390 ページを作らないための関門
      - name: データを検証する
        run: npm run check:data

      - name: ユニットテストを流す
        run: npm test

      # 文章の検査（非日本語文字の混入・孤立ページ・リンク切れ・定型段落の重複・誇張語）
      - name: サイト全体を検査する
        run: npm run check:site

      # ここが本体。生成し直して差分が出たら落とす
      - name: 生成物が最新か確かめる
        run: |
          npm run build
          git diff --exit-code

      - name: 公開物を検査する
        run: node --test test/dist.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium

      # **HTTP 経由で確かめる。** file:// では絶対パスのリンクと localStorage の
      # 扱いが本番と変わるので、確かめたことにならない
      - name: E2E とアクセシビリティ検査を流す
        run: npm run test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
