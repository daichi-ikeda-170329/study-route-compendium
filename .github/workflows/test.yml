# push と PR のたびに、生成が再現できることと検査が通ることを確かめる。
#
# **ここで見るのは「同じ入力から同じ生成物が出るか」。** 生成物に差分が出たら
# 落とす（開発者が意図を確かめてコミットする）。CI からリポジトリへは push しない。
# 生成の順序は build/all.mjs が持つので、ここでは並べ直さない。
name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読み取りだけ。生成物を CI から書き戻さない
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      # データが壊れた状態から 1,390 ページを作らないための関門
      - name: データを検証する
        run: npm run check:data

      - name: ユニットテストを流す
        run: npm test

      # 文章の検査（非日本語文字の混入・孤立ページ・リンク切れ・定型段落の重複・誇張語）
      - name: サイト全体を検査する
        run: npm run check:site

      # ここが本体。生成し直して差分が出たら落とす
      - name: 生成物が最新か確かめる
        run: |
          npm run build
          git diff --exit-code

      - name: 公開物を検査する
        run: node --test test/dist.test.mjs

      # 書影の取得元の整合。**外部へ 1 回も出ない**ので必須ゲートにできる。
      # 実際に取りに行く検査（--live）は links.yml の週次に置いてある
      - name: 書影の取得元を検査する
        run: npm run check:covers

      - name: 性能の予算を検査する
        run: npm run check:budgets

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: ブラウザを入れる
        # cross-browser の spec だけ Firefox / WebKit で回す（e2e/cross-browser.spec.mjs）。
        # **全 spec を 3 ブラウザへ掛け算しない。** 実行時間が跳ね、落ちても読まれなくなる
        run: npx playwright install --with-deps chromium firefox webkit

      # **HTTP 経由で確かめる。** file:// では絶対パスのリンクと localStorage の
      # 扱いが本番と変わるので、確かめたことにならない
      - name: E2E とアクセシビリティ検査を流す（Chromium 4 幅）
        run: npx playwright test --project=desktop-1366 --project=tablet-768 --project=mobile-375 --project=narrow-320

      - name: Firefox と WebKit で主要フローを流す
        run: npm run test:cross-browser

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
