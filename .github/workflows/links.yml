# 外部リソース（書影・Amazon の商品ページ）の生存確認。
#
# push のたびに数千件の外部リクエストを投げるわけにはいかないので、週 1 回だけ流す。
# **落とさない。** 外部サービスの一時的な不調でジョブが赤くなり続けると、
# 本当の欠損に気づけなくなる。結果はジョブのログとサマリで読む。
#
# 書影が全候補とも取れない本が出たら、出版社の商品画像を BOOKS[].cover に入れるか、
# どこにも画像が無いと確認できたら BOOKS[].nocover を立てる（README の「書影」の節）。
name: 外部リンクの確認

on:
  schedule:
    # 毎週月曜 03:00 JST（UTC 18:00 日曜）
    - cron: '0 18 * * 0'
  workflow_dispatch:

# 読み取りだけ
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 書影と商品ページを確認する
        run: node build/check-links.mjs | tee "$GITHUB_STEP_SUMMARY"

      # 機械可読な結果も残す。持続的な欠損だけを拾って直すときに使う。
      # **issue は乱造しない。**同じ不備で毎週 issue が増えると読まれなくなるので、
      # 記録は artifact に置き、直すかどうかは人がまとめて判断する
      - name: 結果を artifact に残す
        run: node build/check-links.mjs --json > link-report.json

      - uses: actions/upload-artifact@v7
        with:
          name: link-report
          path: link-report.json
          retention-days: 90
