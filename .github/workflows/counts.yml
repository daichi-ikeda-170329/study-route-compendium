# 収録冊数の表記が実データからずれたまま公開されるのを防ぐ。
#
# 参考書を足すと、ポータルの title・meta・JSON-LD・科目トップ・README・生成ページの
# 数十か所がいっせいに古くなる。手順書に「apply-count.mjs を流す」と書くだけでは
# 忘れるので、push のたびにここで確かめる。
#
# **CI から main へ push しない。**（2026-09 に変更）
# 以前はここで自動修正してコミットしていたが、保護ブランチへ CI が書き戻す構造は
# 「誰が何を変えたか」を追えなくする。ずれていたら落とすだけにして、
# 直すのは開発者の手元（`npm run build`）にそろえた。
name: 冊数の整合

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読み取りだけ。書き戻さない
permissions:
  contents: read

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 冊数の検査は Node 標準だけで動く
          node-version: '22'

      - name: 冊数が実データと一致しているか
        run: npm run check:counts

      - name: 年度表記が site-meta.json と一致しているか
        run: node build/apply-site-meta.mjs --check
